<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/via_logo_black.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The two faces the first screen is set in.

      Both are named in the stylesheet, so the browser only learns they exist
      once it has fetched and parsed a stylesheet that is itself holding the
      first paint. That puts a whole round trip between the paint and readable
      text, and it is also what makes the page move: text lands in the fallback
      face and reflows when the real one arrives. Asking for them here takes
      that round trip out of both. The mono face is not here, because nothing
      above the fold is set in it.

      crossorigin is required even though these are our own files: a font is
      fetched anonymously whatever the page says, and a preload that does not
      say so is a second download rather than a head start.
    -->
    <link rel="preload" href="/fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      The server fills these in per page before sending the document, in
      server/middleware/htmlShell.js. What is here is the fallback for the
      development server and for the rare case where the server cannot describe
      a page, so the sharing and canonical tags are deliberately not here: the
      server adds those, and a second copy would compete with them.
    -->
    <title>VIA: events from ECE student organizations at Illinois</title>
    <meta name="description" content="Find every event run by Electrical and Computer Engineering student organizations at the University of Illinois Urbana-Champaign, in one place. Browse upcoming talks, workshops, socials and info sessions, and see the shared midterm calendar." />
    <meta name="robots" content="index, follow" />

    <!--
      The colour a phone paints its browser bar with. It was the university's
      blue, which is a colour VIA's own design does not contain, so the frame
      around the site and the site inside it belonged to two different systems.
      This is the paper the dark theme is drawn on.
    -->
    <meta name="theme-color" content="#0a1516" />
    <meta property="og:site_name" content="VIA" />
    <meta property="og:locale" content="en_US" />
    <!--
      The picture a link is shared with. Nothing named one before this, here or
      on the server, so a shared VIA link arrived with no picture at all. The
      server names an event's own card on an event page; this is what every
      other page, and every reader that does not run the server rendered shell,
      falls back to.
    -->
    <meta property="og:image" content="https://viaillinois.com/og/card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VIA: every event from Electrical and Computer Engineering student organizations at Illinois, in one place." />
    <meta name="twitter:image" content="https://viaillinois.com/og/card.png" />
    <!--
      The large card rather than the small one. A thumbnail beside a line of
      text is what the summary card draws, and the banner is what gets a link
      opened.
    -->
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Settle the theme before first paint, so nobody watches a light page turn
      dark. The class is what the client has always toggled and what every
      unconverted screen still reads. The attribute is what the design system's
      stylesheet reads, and it also tells the dark media query in app.css to
      stand aside for somebody who asked for the light theme on a system set to
      dark. Both are written here so the two never disagree.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var m = localStorage.getItem('via-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = m === 'dark' || (m !== 'light' && prefersDark);
          root.classList.toggle('dark', dark);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
