# Local development database.
#
# Separate from docker-compose.test.yml, which keeps its data in tmpfs so that
# every test run starts from nothing. A preview database has the opposite
# requirement: what you enter through the UI has to still be there after a
# restart, so this one uses a named volume and a port of its own.
#
# Never point this at production. See docs/development.md.
services:
  dev-db:
    image: mysql:8.0
    environment:
      # Root and the application account share a password, exactly as
      # docker-compose.yml does in production. The backup, restore and
      # migration code falls back from DB_ADMIN_PASSWORD to DB_PASSWORD, so
      # giving them different values here would make a preview database behave
      # unlike production and fail on the first migration.
      MYSQL_ROOT_PASSWORD: dev_pw
      MYSQL_DATABASE: via
      MYSQL_USER: via
      MYSQL_PASSWORD: dev_pw
    ports:
      - "3308:3306"
    volumes:
      - dev_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdev_pw"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  dev_db_data:
