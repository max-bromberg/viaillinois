name: gate

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

jobs:
  quality:
    name: tests, build and language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:all

      - name: Version consistency
        run: npx vitest run scripts/tests/version.test.js

      - name: Language check
        run: npm run check:language

      - name: Language check tests
        run: npm run test:language

      - name: Bump script tests
        run: npx vitest run scripts/tests/bumpVersion.test.js

      - name: Server fast tests
        run: npm test --prefix server

      - name: Client tests
        run: npm test --prefix client

      - name: Client build
        run: npm run build

      # Reported, never enforced. A threshold chosen before the real number is
      # known only ever gets lowered until it passes.
      - name: Coverage, reported not enforced
        run: cd server && npx vitest run --coverage || true

  database:
    name: migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:all

      # The same compose file developers use locally, so a failure here is a real
      # signal rather than a difference in how CI provisions its database.
      - name: Start the throwaway database
        run: docker compose -f docker-compose.test.yml up -d test-db

      - name: Migrations apply cleanly from empty
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3307'
          DB_USER: root
          DB_PASSWORD: test_root_pw
          DB_NAME: via_test
        run: node --experimental-strip-types server/db/migrate.ts

      # Run from server/, because drizzle.config.ts declares its schema and
      # migration paths relative to the working directory, not to itself.
      - name: Drizzle drift check
        run: cd server && npx drizzle-kit check

      - name: Database tests
        run: npm run test:db --prefix server

      - name: Stop the throwaway database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  security:
    name: audit and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:all

      - name: Audit root
        run: npm audit --audit-level=high

      - name: Audit server
        run: npm audit --audit-level=high --prefix server

      - name: Audit client
        run: npm audit --audit-level=high --prefix client

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
