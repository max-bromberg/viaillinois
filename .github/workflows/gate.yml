name: gate

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

jobs:
  quality:
    name: tests, build and language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:all

      - name: Version consistency
        run: npx vitest run scripts/tests/version.test.js

      - name: Language check
        run: npm run check:language

      - name: Language check tests
        run: npm run test:language

      - name: Bump script tests
        run: npx vitest run scripts/tests/bumpVersion.test.js

      - name: Compose file tests
        run: npx vitest run scripts/tests/composeFile.test.js

      # The cutover deploys the website and the Discord bot together, from two
      # checkouts, and these run the real script against stub docker and curl
      # commands to check the order of its steps and each of its refusals.
      - name: Cutover and bot pin tests
        run: npx vitest run scripts/tests/cutover.test.js scripts/tests/botRelease.test.js

      - name: Server fast tests
        run: npm test --prefix server

      - name: Client tests
        run: npm test --prefix client

      - name: Client build
        run: npm run build

      # Reported, never enforced. A threshold chosen before the real number is
      # known only ever gets lowered until it passes.
      # Scoped to the unit project, because this job has no database container
      # and the db project cannot run here.
      - name: Coverage, reported not enforced
        run: cd server && npx vitest run --project unit --coverage || true

  database:
    name: migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:all

      # The same compose file and the same readiness wait that developers use
      # locally, so a failure here is a real signal rather than a difference in
      # how CI provisions its database. startTestDb polls with a real
      # connection, because MySQL reports healthy shortly before it finishes
      # first-boot initialization and docker compose up would return too early.
      #
      # That compose file mounts server/db/init, so this step also runs the
      # initialisation script that creates the Discord bot's database and its
      # account. A script that does not work stops the container from starting,
      # and the deploy that would have run it on the server never happens. What
      # the script built is then checked by tests/db/botDatabaseInit.db.test.js
      # below, which is where the reach of the bot's account is asserted.
      - name: Start the throwaway database, running the bot database script
        run: cd server && node -e "import('./tests/support/testDb.js').then(m => m.startTestDb())"

      - name: Migrations apply cleanly from empty
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3307'
          DB_USER: root
          DB_PASSWORD: test_root_pw
          DB_NAME: via_test
        run: node --experimental-strip-types server/db/migrate.ts

      # Run from server/, because drizzle.config.ts declares its schema and
      # migration paths relative to the working directory, not to itself.
      - name: Drizzle drift check
        run: cd server && npx drizzle-kit check

      - name: Database tests
        run: npm run test:db --prefix server

      - name: Stop the throwaway database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  security:
    name: audit and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:all

      - name: Audit root
        run: npm audit --audit-level=high

      - name: Audit server
        run: npm audit --audit-level=high --prefix server

      - name: Audit client
        run: npm audit --audit-level=high --prefix client

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
